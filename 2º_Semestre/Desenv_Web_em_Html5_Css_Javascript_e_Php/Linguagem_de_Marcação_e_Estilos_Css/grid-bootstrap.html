<!DOCTYPE html>

<html lang="PT-BR">
    <head>
        <meta charset="utf-8">
        <title>Bootstrap Grid</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
        <style>
            div {
                padding: 5px;
                color: #fff;
                font-weight: bold;
            }

            .border {
                border: 1px solid #999999;
            }

            .container {
                background: green;
            }

            .container-fluid {
                margin-top: 50px;
                background: orange;
            }

        </style>
    </head>

    <body>
        <!-- .container: Largura definida e responsiva-->
        <div class="container text-center">
            <div class="row">
                <div class="col border">
                    Linha 1 - Coluna 1
                </div>
                <div class="col border">
                    Linha 1 - Coluna 2
                </div>
            </div>
            <div class="row">
                <div class="col border">
                    Linha 2 - Coluna 1
                </div>
                <div class="col border">
                    Linha 2 - Coluna 2
                </div>
                <div class="col border">
                    Linha 2 - Coluna 3
                </div>
            </div>
        </div>

        <!-- .container-fluid: Largura 100%-->
         <div class="container-fluid">
            <div class="row">
                <div class="col-4 border">
                    Linha 1 - Coluna 1
                </div>
                <div class="col-8 border">
                    Linha 1 - Coluna 2
                </div>
            </div>
            <div class="row">
                <div class="col-6 border">
                    Linha 2 - Coluna 1
                </div>
                <div class="col-3 border">
                    Linha 2 - Coluna 2
                </div>
                <div class="col-3 border">
                    Linha 2 - Coluna 3
                </div>
            </div>
         </div>
    </body>

</html>

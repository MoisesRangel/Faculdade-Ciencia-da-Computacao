<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Box Model em CSS</title>
        <style>
            div {
                color: #fff;
                font-weight: bold;
                font-size: 20px;
            }
            #box-inicial {
                width: 400px;
                height: 200px;
                background-color: red;
            }
            #box-exemplo {
                width: 400px;
                height: 200px;
                margin: 30px 20px 50px 15px;
                background-color: blue;
                padding: 50px;
                border: 10px solid black;
            }

            #box-final {
                width: 400px;
                height: 200px;
                background-color: green;
            }
        </style>
    </head>
    <body>
        <div id="box-inicial">
            Conteúdo do Box inicial
        </div>
        <div id="box-exemplo">
            Conteúdo do box de exemplo
        </div>
        <div id="box-final">
            Conteúdo do box final
        </div>
    </body>
</html>

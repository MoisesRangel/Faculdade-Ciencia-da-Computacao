<!DOCTYPE html>
<html>
    <head>

    </head>
    <body>
        <h2>Tabela com titulo</h2>
        <table>
            <tr>
                <td>Smith</td>
                <td>HTML</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Sunday</td>
                <td>JavaScript</td>
                <td>10</td>
            </tr>
        </table>

        <h2>Tabela com cabeçalho e rodapé</h2>
        <table width="50%" border="2">
            <thead>
                <tr>
                    <th>Mês</th>
                    <th>Horas/Aula</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Junho</td>
                    <td>40</td>
                </tr>
                <tr>
                    <td>Julho</td>
                    <td>30</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th>Total</th>
                    <th>70</th>
                </tr>
            </tfoot>
        </table>
        <!--Tabela com Colspan-->
        <h2>Tabela Simples</h2>
        <table width="50%" border="2">
            <tr>
                <td>Aluno</td>
                <td colspan="3">Disciplina</td>
            </tr>

            <tr>
                <td>Alex</td>
                <td>HTML</td>
                <td>Ambiente Web</td>
                <td>Outro elemento</td>
            </tr>
        </table>

        <!--Tabela com Rowspan-->
        <h2>Outra Tabela simples</h2>
        <table width="50%" border="2">
            <tr>
                <td>Aluno</td>
                <td rowspan="2">Disciplina</td>
            </tr>
            <tr>
                <td>Alex</td>
                <td>HTML</td>
                <td>Ambiente Web</td>
            </tr>
            
        </table>
        <table> 
<tr><td>Col 1</td><td>Col 4</td></tr> 
<tr><td>Col 2</td><td>Col 5</td></tr> 
<tr><td>Col 3</td><td>Col 6</td></tr> 
</table>
    </body>
</html>
